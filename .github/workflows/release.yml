name: Linux Release Build & Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-linux:
    name: Build and package Linux x86_64
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Install native packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes dpkg-dev rpm rpm-build cpio

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Verify formatting
        run: cargo fmt --all -- --check

      - name: Compile all targets and features
        run: cargo check --locked --all-targets --all-features

      - name: Run complete test suite
        run: cargo test --locked --all-targets --all-features

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Build release binary
        run: cargo build --locked --release --all-features

      - name: Inspect runtime linkage
        run: |
          ldd target/release/termexplorer | tee /tmp/termexplorer-ldd.txt
          if grep -q 'not found' /tmp/termexplorer-ldd.txt; then
            echo 'Release binary has unresolved shared-library dependencies.' >&2
            exit 1
          fi

      - name: Smoke-test release binary
        run: |
          ./target/release/termexplorer --version
          ./target/release/termexplorer --help

      - name: Create Debian and RPM packages
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          fi
          mkdir -p dist
          scripts/package_linux.sh target/release/termexplorer "$VERSION" dist
          DEB_VERSION="${VERSION/-/\~}"
          dpkg-deb --info "dist/termexplorer_${DEB_VERSION}_amd64.deb"
          dpkg-deb --contents "dist/termexplorer_${DEB_VERSION}_amd64.deb"
          rpm -qpi dist/termexplorer-*.rpm
          rpm -qpl dist/termexplorer-*.rpm
          scripts/test_package_linux.sh "$VERSION" dist

      - name: Create portable archive and artifact manifest
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          fi
          STAGE="termexplorer-${VERSION}-linux-x86_64"
          mkdir -p "$STAGE"
          install -m 0755 target/release/termexplorer "$STAGE/termexplorer"
          install -m 0644 README.md LICENSE CHANGELOG.md INSTALLATION.md "$STAGE/"
          tar -czf "dist/${STAGE}.tar.gz" "$STAGE"
          rm -rf "$STAGE"
          cp /tmp/termexplorer-ldd.txt dist/ELF_DEPENDENCIES.txt
          (cd dist && sha256sum ./*.deb ./*.rpm ./*.tar.gz > SHA256SUMS)
          {
            printf 'TermExplorer version: %s\n' "$VERSION"
            printf 'Source ref: %s\n' "$GITHUB_REF_NAME"
            printf 'Target: linux-x86_64-unknown-linux-gnu\n'
            printf 'Artifacts:\n'
            find dist -maxdepth 1 -type f -printf '  %f (%s bytes)\n' | sort
          } > dist/MANIFEST.txt

      - name: Upload staged package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: termexplorer-linux-x86_64-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish GitHub release assets
    needs: build-linux
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download validated release artifacts
        uses: actions/download-artifact@v8
        with:
          name: termexplorer-linux-x86_64-${{ github.ref_name }}
          path: dist/

      - name: Determine prerelease status
        id: release-kind
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" == *-rc* || "$GITHUB_REF_NAME" == *-beta* || "$GITHUB_REF_NAME" == *-alpha* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release assets
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/MANIFEST.txt
            dist/ELF_DEPENDENCIES.txt
          generate_release_notes: true
          prerelease: ${{ steps.release-kind.outputs.prerelease }}
