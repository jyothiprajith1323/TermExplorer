[package]
name = "termexplorer"
version = "1.1.0"
edition = "2021"
authors = ["TermExplorer Contributors"]
description = "TermExplorer is a highly customizable Rust terminal developer workstation combining a file explorer, intelligent code editor, interactive Linux terminal, multimedia preview engine and system monitor"
license = "MIT"
repository = "https://github.com/jyothiprajith1323/TermExplorer"
keywords = ["tui", "file-explorer", "terminal", "ratatui"]
categories = ["command-line-utilities"]

[lib]
name = "termexplorer"
path = "src/lib.rs"

[[bin]]
name = "termexplorer"
path = "src/main.rs"

[dependencies]
# TUI
ratatui = { version = "0.30", features = ["all-widgets"] }
crossterm = { version = "0.28", features = ["event-stream"] }

# WebAssembly Plugin Runtime & Hashing
wasmi = "0.36"
sha2 = "0.11"

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
futures = "0.3"

# Filesystem watching
notify = { version = "7", features = ["serde"] }

# System monitoring
sysinfo = "0.33"

# Configuration
serde = { version = "1", features = ["derive"] }
toml = "1.2"
serde_json = "1"

# Error handling
anyhow = "1"
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"

# Terminal / PTY
portable-pty = "0.8"

# Syntax highlighting
syntect = { version = "5", default-features = false, features = ["default-fancy"] }

# Path handling
dirs = "6"
shellexpand = "3"

# Unicode / text
unicode-width = "0.2"
unicode-segmentation = "1"
ropey = "1.6"

# Time
chrono = { version = "0.4", features = ["serde"] }

# String matching / fuzzy search
fuzzy-matcher = "0.3"

# Byte size formatting
bytesize = "1"

# Atomic file writes
tempfile = "3"

# Universal preview dependencies
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
mime_guess = "2"

[dev-dependencies]
proptest = "1.12.0"
tokio-test = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true
