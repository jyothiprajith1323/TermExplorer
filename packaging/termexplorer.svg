<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#181825"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cba6f7"/>
      <stop offset="100%" stop-color="#89b4fa"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#11111b" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Outer Window Frame -->
  <rect x="8" y="10" width="112" height="108" rx="14" fill="url(#bg-grad)" stroke="#313244" stroke-width="2" filter="url(#shadow)"/>

  <!-- Titlebar -->
  <path d="M 8 24 A 14 14 0 0 1 22 10 L 106 10 A 14 14 0 0 1 120 24 L 120 28 L 8 28 Z" fill="#11111b"/>
  <!-- Window Controls -->
  <circle cx="20" cy="19" r="4" fill="#f38ba8"/>
  <circle cx="32" cy="19" r="4" fill="#f9e2af"/>
  <circle cx="44" cy="19" r="4" fill="#a6e3a1"/>
  <!-- Workstation Title Badge -->
  <text x="64" y="22" fill="#a6adc8" font-family="system-ui, sans-serif" font-size="7" font-weight="bold" text-anchor="middle" letter-spacing="0.5">TERMEXPLORER</text>

  <!-- Main Split Layout -->
  <!-- Left Pane (25% Explorer) -->
  <rect x="14" y="34" width="28" height="78" rx="6" fill="#181825" stroke="#313244" stroke-width="1.2"/>

  <!-- Explorer Tree Nodes -->
  <!-- Root folder -->
  <rect x="18" y="40" width="8" height="5" rx="1.5" fill="#f9e2af"/>
  <rect x="28" y="42" width="10" height="2" rx="1" fill="#cdd6f4"/>

  <!-- Sub-branch 1 -->
  <path d="M 22 47 L 22 55 L 26 55" stroke="#45475a" stroke-width="1.2" fill="none"/>
  <rect x="28" y="53" width="11" height="2" rx="1" fill="#89b4fa"/>

  <!-- Sub-branch 2 (Active/Selected) -->
  <path d="M 22 55 L 22 67 L 26 67" stroke="#45475a" stroke-width="1.2" fill="none"/>
  <rect x="17" y="62" width="22" height="9" rx="3" fill="#313244" stroke="#cba6f7" stroke-width="1"/>
  <circle cx="21" cy="66.5" r="1.5" fill="#cba6f7"/>
  <rect x="25" y="65.5" width="11" height="2" rx="1" fill="#cba6f7"/>

  <!-- Sub-branch 3 -->
  <path d="M 22 67 L 22 79 L 26 79" stroke="#45475a" stroke-width="1.2" fill="none"/>
  <rect x="28" y="77" width="9" height="2" rx="1" fill="#a6adc8"/>

  <!-- Right Pane (75% Preview/Inspector) -->
  <rect x="46" y="34" width="68" height="78" rx="6" fill="#181825" stroke="#313244" stroke-width="1.2"/>

  <!-- Preview Header Tab -->
  <path d="M 50 38 L 74 38 L 72 44 L 50 44 Z" fill="#313244"/>
  <text x="54" y="43" fill="#89b4fa" font-family="monospace" font-size="5" font-weight="bold">main.rs</text>

  <!-- Code Syntax Lines -->
  <rect x="52" y="49" width="16" height="2.5" rx="1" fill="#cba6f7"/>
  <rect x="71" y="49" width="22" height="2.5" rx="1" fill="#89b4fa"/>

  <rect x="56" y="55" width="28" height="2" rx="1" fill="#cdd6f4"/>
  <rect x="87" y="55" width="14" height="2" rx="1" fill="#a6e3a1"/>

  <rect x="56" y="60" width="36" height="2" rx="1" fill="#a6adc8"/>
  <rect x="56" y="65" width="20" height="2" rx="1" fill="#fab387"/>

  <!-- Mini Terminal Drawer (15% height at bottom) -->
  <rect x="49" y="86" width="62" height="22" rx="4" fill="#11111b" stroke="#45475a" stroke-width="1"/>
  <text x="53" y="93" fill="#a6adc8" font-family="monospace" font-size="4">PTY 1 [bash]</text>
  <!-- Command prompt indicator -->
  <path d="M 53 98 L 56 100 L 53 102" fill="none" stroke="#a6e3a1" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="58" y="99" width="16" height="2" rx="1" fill="#cdd6f4"/>
  <rect x="76" y="98.5" width="3" height="3" fill="#cba6f7"/>
</svg>
