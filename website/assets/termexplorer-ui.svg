<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#000000" flood-opacity="0.65"/>
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#89b4fa" flood-opacity="0.15"/>
    </filter>
    <linearGradient id="windowBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#89b4fa" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#cba6f7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#313244" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#181825"/>
      <stop offset="100%" stop-color="#11111b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#89b4fa"/>
      <stop offset="100%" stop-color="#cba6f7"/>
    </linearGradient>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace; }
    .sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
    .bold { font-weight: 700; }
    .dim { fill: #6c7086; }
    .sub { fill: #a6adc8; }
    .white { fill: #cdd6f4; }
    .bright { fill: #ffffff; }
    .blue { fill: #89b4fa; }
    .mauve { fill: #cba6f7; }
    .green { fill: #a6e3a1; }
    .yellow { fill: #f9e2af; }
    .peach { fill: #fab387; }
    .red { fill: #f38ba8; }
    .cyan { fill: #89dceb; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="700" fill="#0b0c10" rx="16"/>

  <!-- Main Workstation Window Frame -->
  <g filter="url(#shadow)">
    <rect x="20" y="20" width="1160" height="660" rx="12" fill="#1e1e2e" stroke="url(#windowBorder)" stroke-width="1.5"/>

    <!-- Window Title Bar -->
    <rect x="20" y="20" width="1160" height="38" rx="12" fill="#181825"/>
    <path d="M 20 46 L 20 58 L 1180 58 L 1180 46 Z" fill="#181825"/>
    <line x1="20" y1="58" x2="1180" y2="58" stroke="#313244" stroke-width="1"/>

    <!-- Traffic Lights -->
    <circle cx="44" cy="39" r="6" fill="#f38ba8"/>
    <circle cx="64" cy="39" r="6" fill="#f9e2af"/>
    <circle cx="84" cy="39" r="6" fill="#a6e3a1"/>

    <text x="580" y="44" text-anchor="middle" class="mono sub" font-size="12" font-weight="600">
      termexplorer — ~/TermExplorer <tspan class="blue">●</tspan> <tspan class="dim">25% Explorer │ 75% Preview │ 85% Workspace Height │ 15% Terminal</tspan>
    </text>

    <!-- Workstation Application Header -->
    <rect x="20" y="58" width="1160" height="36" fill="#11111b"/>
    <line x1="20" y1="94" x2="1180" y2="94" stroke="#313244" stroke-width="1"/>

    <!-- Brand -->
    <rect x="32" y="66" width="20" height="20" rx="4" fill="url(#accentGrad)"/>
    <text x="42" y="80" text-anchor="middle" class="mono" font-size="12" font-weight="900" fill="#11111b">⚡</text>
    <text x="60" y="81" class="mono bold bright" font-size="13">TERMEXPLORER</text>
    <rect x="175" y="68" width="56" height="17" rx="8" fill="rgba(137,180,250,0.15)"/>
    <text x="203" y="80" text-anchor="middle" class="mono blue" font-size="10" font-weight="700">v1.1.0</text>

    <!-- Breadcrumb -->
    <text x="250" y="81" class="mono sub" font-size="12">
      ~ / TermExplorer / <tspan class="blue bold">src</tspan> / <tspan class="white bold">ui</tspan>
    </text>

    <!-- Git Branch Pill -->
    <rect x="520" y="67" width="130" height="19" rx="4" fill="#181825" stroke="#313244" stroke-width="1"/>
    <text x="530" y="81" class="mono mauve bold" font-size="11"> master</text>
    <text x="595" y="81" class="mono green bold" font-size="11">● staged</text>

    <!-- Header Action Buttons -->
    <g transform="translate(730, 66)">
      <rect x="0" y="0" width="100" height="21" rx="4" fill="#313244"/>
      <text x="10" y="14" class="mono sub" font-size="10.5">󰍉 Search <tspan class="yellow">^P</tspan></text>

      <rect x="108" y="0" width="108" height="21" rx="4" fill="#313244"/>
      <text x="116" y="14" class="mono sub" font-size="10.5">󰒓 Settings <tspan class="yellow">F10</tspan></text>

      <rect x="224" y="0" width="102" height="21" rx="4" fill="#313244"/>
      <text x="232" y="14" class="mono sub" font-size="10.5">󰏖 Plugins <tspan class="yellow">^X</tspan></text>

      <rect x="334" y="0" width="88" height="21" rx="4" fill="rgba(137,180,250,0.2)" stroke="#89b4fa" stroke-width="1"/>
      <text x="344" y="14" class="mono blue bold" font-size="10.5">󰋖 Help <tspan class="yellow">F1</tspan></text>
    </g>

    <!-- ════════════ MAIN WORKSPACE (25% / 75% SPLIT, 85% HEIGHT) ════════════ -->
    <!-- Content Height: 475px (85% of content area). Terminal Height: 86px (15% of content area). -->

    <!-- LEFT PANEL: 25% File Explorer -->
    <rect x="20" y="94" width="290" height="475" fill="#181825"/>
    <line x1="310" y1="94" x2="310" y2="569" stroke="#313244" stroke-width="1"/>

    <!-- Explorer Header -->
    <rect x="20" y="94" width="290" height="28" fill="#1e1e2e"/>
    <line x1="20" y1="122" x2="310" y2="122" stroke="#313244" stroke-width="1"/>
    <text x="34" y="112" class="mono blue bold" font-size="11">📁 EXPLORER (25%)</text>
    <text x="210" y="112" class="mono dim" font-size="10">24 files │ 3 dirs</text>

    <!-- File Tree Entries -->
    <g transform="translate(32, 134)" font-size="11.5" class="mono">
      <text y="14" class="blue bold">󰉋 src/</text>

      <text y="36" class="dim">  ├─ </text><text x="36" y="36" class="white">lib.rs</text><text x="210" y="36" class="dim">2.4K</text>
      <text y="58" class="dim">  ├─ </text><text x="36" y="58" class="white">main.rs</text><text x="210" y="58" class="dim">4.1K</text>
      <text y="80" class="dim">  ├─ </text><text x="36" y="80" class="white">app.rs</text><text x="210" y="80" class="dim">98K</text>
      <text y="102" class="dim">  ├─ </text><text x="36" y="102" class="white">config.rs</text><text x="210" y="102" class="dim">12K</text>
      <text y="124" class="dim">  ├─ </text><text x="36" y="124" class="white">state.rs</text><text x="210" y="124" class="dim">16K</text>

      <text y="146" class="blue bold">  └─ 󰉋 ui/</text>

      <!-- Active Selection Row (help.rs) -->
      <rect x="18" y="156" width="250" height="24" rx="4" fill="rgba(137,180,250,0.18)" stroke="#89b4fa" stroke-width="1"/>
      <text y="172" class="dim">      ├─ </text><text x="64" y="172" class="blue bold">help.rs</text><text x="210" y="172" class="green bold">8.4K ●</text>

      <text y="194" class="dim">      ├─ </text><text x="64" y="194" class="sub">layout.rs</text><text x="210" y="194" class="dim">7.5K</text>
      <text y="216" class="dim">      ├─ </text><text x="64" y="216" class="sub">preview.rs</text><text x="210" y="216" class="dim">38K</text>
      <text y="238" class="dim">      ├─ </text><text x="64" y="238" class="sub">terminal.rs</text><text x="210" y="238" class="dim">9.6K</text>
      <text y="260" class="dim">      └─ </text><text x="64" y="260" class="sub">settings.rs</text><text x="210" y="260" class="dim">8.9K</text>

      <text y="284" class="sub">󰉋 tests/ (20 suites)</text>
      <text y="306" class="sub">󰉋 website/</text>
      <text y="328" class="peach"> Cargo.toml</text><text x="210" y="328" class="dim">3.2K</text>
      <text y="350" class="cyan">󰂺 README.md</text><text x="210" y="350" class="dim">8.1K</text>
      <text y="372" class="dim">󰞷 install.sh</text><text x="210" y="372" class="dim">1.8K</text>
    </g>

    <!-- RIGHT PANEL: 75% Universal Contextual Preview -->
    <rect x="310" y="94" width="870" height="475" fill="#11111b"/>

    <!-- Preview Header & Inspector Tabs -->
    <rect x="310" y="94" width="870" height="28" fill="#181825"/>
    <line x1="310" y1="122" x2="1180" y2="122" stroke="#313244" stroke-width="1"/>

    <g transform="translate(324, 100)" class="mono" font-size="11">
      <!-- Active Tab -->
      <rect x="0" y="0" width="130" height="22" rx="4" fill="#313244"/>
      <text x="14" y="15" class="blue bold">󰈚 PREVIEW</text>

      <rect x="138" y="0" width="125" height="22" rx="4" fill="transparent"/>
      <text x="148" y="15" class="dim">󰋖 INFORMATION</text>

      <rect x="270" y="0" width="90" height="22" rx="4" fill="transparent"/>
      <text x="282" y="15" class="dim">󰞷 HEX DUMP</text>

      <rect x="368" y="0" width="95" height="22" rx="4" fill="transparent"/>
      <text x="380" y="15" class="dim">⚡ ACTIONS</text>
    </g>

    <text x="1160" y="112" text-anchor="end" class="mono dim" font-size="10.5">
      src/ui/help.rs  │  Rust  │  UTF-8  │  [F11 / z] Fullscreen (100%)
    </text>

    <!-- Syntax Highlighted Code Buffer Content (help.rs) -->
    <g transform="translate(324, 134)" font-size="11.5" class="mono" xml:space="preserve">
      <!-- Line Numbers Column -->
      <g class="dim" text-anchor="end">
        <text x="30" y="16">1</text>
        <text x="30" y="36">2</text>
        <text x="30" y="56">3</text>
        <text x="30" y="76">4</text>
        <text x="30" y="96">5</text>
        <text x="30" y="116">6</text>
        <text x="30" y="136">7</text>
        <text x="30" y="156">8</text>
        <text x="30" y="176">9</text>
        <text x="30" y="196">10</text>
        <text x="30" y="216">11</text>
        <text x="30" y="236">12</text>
        <text x="30" y="256">13</text>
        <text x="30" y="276">14</text>
        <text x="30" y="296">15</text>
        <text x="30" y="316">16</text>
        <text x="30" y="336">17</text>
        <text x="30" y="356">18</text>
        <text x="30" y="376">19</text>
      </g>
      <line x1="42" y1="4" x2="42" y2="410" stroke="#1e1e2e" stroke-width="1"/>

      <!-- Code Tokens -->
      <g transform="translate(56, 0)">
        <text y="16"><tspan class="dim">// Keyboard shortcuts reference modal — workstation quick reference matrix.</tspan></text>
        <text y="36"><tspan class="mauve bold">use</tspan> <tspan class="white">crate::theme::Theme;</tspan></text>
        <text y="56"><tspan class="mauve bold">use</tspan> <tspan class="white">crate::ui::hit_test::{AppAction, HitRegistry, WidgetId};</tspan></text>
        <text y="76"><tspan class="mauve bold">use</tspan> <tspan class="white">ratatui::{layout::{Constraint, Layout, Rect}, Frame};</tspan></text>
        <text y="96"></text>
        <text y="116"><tspan class="mauve bold">pub struct</tspan> <tspan class="yellow bold">HelpCategory</tspan> <tspan class="white">{</tspan></text>
        <text y="136"><tspan class="white">    </tspan><tspan class="mauve bold">pub</tspan> <tspan class="white">id: </tspan><tspan class="cyan">usize</tspan><tspan class="white">, </tspan><tspan class="mauve bold">pub</tspan> <tspan class="white">key_hint: &amp;'static </tspan><tspan class="cyan">str</tspan><tspan class="white">,</tspan></text>
        <text y="156"><tspan class="white">    </tspan><tspan class="mauve bold">pub</tspan> <tspan class="white">title: &amp;'static </tspan><tspan class="cyan">str</tspan><tspan class="white">, </tspan><tspan class="mauve bold">pub</tspan> <tspan class="white">icon: &amp;'static </tspan><tspan class="cyan">str</tspan><tspan class="white">,</tspan></text>
        <text y="176"><tspan class="white">}</tspan></text>
        <text y="196"></text>
        <text y="216"><tspan class="mauve bold">pub fn</tspan> <tspan class="blue bold">render_help</tspan><tspan class="white">(frame: &amp;</tspan><tspan class="mauve bold">mut</tspan> <tspan class="yellow">Frame</tspan><tspan class="white">, area: </tspan><tspan class="yellow">Rect</tspan><tspan class="white">, active_category: </tspan><tspan class="cyan">usize</tspan><tspan class="white">, theme: &amp;</tspan><tspan class="yellow">Theme</tspan><tspan class="white">) {</tspan></text>
        <text y="236"><tspan class="white">    </tspan><tspan class="dim">// Modal sized responsively with rounded borders and interactive tabs</tspan></text>
        <text y="256"><tspan class="white">    </tspan><tspan class="mauve bold">let</tspan> <tspan class="white">popup_w = area.width.</tspan><tspan class="blue">clamp</tspan><tspan class="white">(76, 114);</tspan></text>
        <text y="276"><tspan class="white">    </tspan><tspan class="mauve bold">let</tspan> <tspan class="white">popup_h = area.height.</tspan><tspan class="blue">clamp</tspan><tspan class="white">(24, 38);</tspan></text>
        <text y="296"><tspan class="white">    frame.</tspan><tspan class="blue">render_widget</tspan><tspan class="white">(Clear, popup);</tspan></text>
        <text y="316"><tspan class="white">    render_category_tabs(frame, tabs_area, active_category, theme, hit_registry);</tspan></text>
        <text y="336"><tspan class="white">}</tspan></text>
      </g>
    </g>

    <!-- ════════════ COMPACT BOTTOM TERMINAL DRAWER (~15% HEIGHT) ════════════ -->
    <rect x="20" y="569" width="1160" height="86" fill="#11111b"/>
    <line x1="20" y1="569" x2="1180" y2="569" stroke="#313244" stroke-width="1.5"/>

    <!-- Terminal Header Bar -->
    <rect x="20" y="569" width="1160" height="22" fill="#181825"/>
    <line x1="20" y1="591" x2="1180" y2="591" stroke="#313244" stroke-width="1"/>

    <text x="34" y="584" class="mono green bold" font-size="11">󰞷 bash (Linux PTY Shell)</text>
    <text x="210" y="584" class="mono dim" font-size="10">~/TermExplorer  │  Session 1  │  Compact ~15% Height  │  [Ctrl+T] Toggle</text>

    <!-- Terminal Controls -->
    <g transform="translate(980, 572)" class="mono" font-size="9.5">
      <rect x="0" y="0" width="46" height="15" rx="3" fill="#313244"/>
      <text x="6" y="11" class="sub">+ New</text>

      <rect x="52" y="0" width="60" height="15" rx="3" fill="#313244"/>
      <text x="58" y="11" class="sub">▲ Maximize</text>

      <rect x="118" y="0" width="60" height="15" rx="3" fill="rgba(243,139,168,0.2)"/>
      <text x="124" y="11" class="red">✕ Close</text>
    </g>

    <!-- Terminal Shell Content -->
    <g transform="translate(34, 608)" class="mono" font-size="10.5" xml:space="preserve">
      <text y="0"><tspan class="green bold">prajith@workstation</tspan><tspan class="white">:</tspan><tspan class="blue bold">~/TermExplorer</tspan><tspan class="white">$ cargo test</tspan></text>
      <text y="18"><tspan class="green bold">     Running unittests</tspan> <tspan class="sub">src/lib.rs ... </tspan><tspan class="green bold">test result: ok. 98 passed; 0 failed; 0 ignored</tspan></text>
      <text y="36"><tspan class="green bold">prajith@workstation</tspan><tspan class="white">:</tspan><tspan class="blue bold">~/TermExplorer</tspan><tspan class="white">$ </tspan><tspan class="yellow">_</tspan></text>
    </g>

    <!-- ════════════ STATUS BAR ════════════ -->
    <rect x="20" y="655" width="1160" height="25" fill="#181825"/>
    <line x1="20" y1="655" x2="1180" y2="655" stroke="#313244" stroke-width="1"/>

    <!-- Mode Pill -->
    <rect x="24" y="658" width="68" height="19" rx="3" fill="url(#accentGrad)"/>
    <text x="58" y="672" text-anchor="middle" class="mono" font-size="10.5" font-weight="900" fill="#11111b">NORMAL</text>

    <!-- Current File & Workstation Metrics -->
    <text x="104" y="672" class="mono sub" font-size="10.5">
      ~/TermExplorer/src/ui/help.rs <tspan class="dim">│</tspan> <tspan class="white">UTF-8</tspan> <tspan class="dim">│</tspan> <tspan class="white">Rust</tspan> <tspan class="dim">│</tspan> <tspan class="blue bold">25% Explorer / 75% Preview</tspan> <tspan class="dim">│</tspan> 85% Workspace / 15% Terminal
    </text>

    <!-- Keyboard Hints -->
    <text x="1160" y="672" text-anchor="end" class="mono sub" font-size="10.5">
      <tspan class="yellow">[F1]</tspan> Help  <tspan class="yellow">[F10]</tspan> Settings  <tspan class="yellow">[^P]</tspan> Palette  <tspan class="yellow">[F7]</tspan> Dual-Pane  <tspan class="yellow">[^T]</tspan> Terminal
    </text>
  </g>
</svg>
