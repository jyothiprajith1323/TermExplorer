[package]
name = "termexplorer-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
termexplorer = { path = ".." }
toml = "0.8"

[[bin]]
name = "fuzz_manifest"
path = "fuzz_targets/fuzz_manifest.rs"
test = false
doc = false

[[bin]]
name = "fuzz_config"
path = "fuzz_targets/fuzz_config.rs"
test = false
doc = false

[[bin]]
name = "fuzz_ansi"
path = "fuzz_targets/fuzz_ansi.rs"
test = false
doc = false

[[bin]]
name = "fuzz_archive_path"
path = "fuzz_targets/fuzz_archive_path.rs"
test = false
doc = false
